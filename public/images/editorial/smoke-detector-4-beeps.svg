<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Smoke detector 4 beeps meaning</title><desc id="d">A smoke alarm with four beep indicators and CO warning.</desc>
<rect width="1200" height="630" fill="#0f172a"/><path d="M0 0h1200v142H0z" fill="#7f1d1d"/><path d="M0 142h1200" stroke="#dc2626" stroke-width="8"/>
<g transform="translate(600 360)"><circle r="95" fill="none" stroke="#dc2626" stroke-width="6"/><circle r="75" fill="#0f172a" stroke="#991b1b" stroke-width="2"/>
<circle r="28" fill="#7f1d1d" stroke="#dc2626" stroke-width="2"/><circle r="8" fill="#ef4444"/></g>
<g transform="translate(280 300)"><text text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="42" font-weight="700">4 BEEPS</text>
<text x="0" y="30" text-anchor="middle" fill="#fcd34d" font-family="Arial" font-size="18">= CO alarm</text>
<text x="0" y="55" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="14">on many models</text></g>
<g transform="translate(920 300)"><text text-anchor="middle" fill="#ef4444" font-family="Arial" font-size="28" font-weight="700">EVACUATE</text>
<text x="0" y="30" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="20" font-weight="700">CALL 911</text>
<text x="0" y="55" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="14">then check manual</text></g>
<text x="94" y="535" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="36" font-weight="700">FOUR BEEPS</text>
<text x="94" y="578" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">Often CO alarm on combo units. Treat loud repeating as emergency.</text></svg>