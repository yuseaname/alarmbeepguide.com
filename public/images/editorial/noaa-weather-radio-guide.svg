<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a2a3a"/><stop offset="100%" stop-color="#243447"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#00acc1"/>
  <!-- Radio body -->
  <rect x="400" y="180" width="400" height="260" rx="12" fill="#eceff1"/>
  <!-- Speaker grille -->
  <rect x="430" y="210" width="180" height="100" rx="6" fill="#cfd8dc"/>
  <circle cx="460" cy="240" r="3" fill="#90a4ae"/><circle cx="490" cy="240" r="3" fill="#90a4ae"/><circle cx="520" cy="240" r="3" fill="#90a4ae"/><circle cx="550" cy="240" r="3" fill="#90a4ae"/><circle cx="580" cy="240" r="3" fill="#90a4ae"/>
  <circle cx="460" cy="270" r="3" fill="#90a4ae"/><circle cx="490" cy="270" r="3" fill="#90a4ae"/><circle cx="520" cy="270" r="3" fill="#90a4ae"/><circle cx="550" cy="270" r="3" fill="#90a4ae"/><circle cx="580" cy="270" r="3" fill="#90a4ae"/>
  <!-- NOAA frequency display -->
  <rect x="640" y="210" width="130" height="40" rx="4" fill="#0d1b2a"/>
  <text x="705" y="237" text-anchor="middle" fill="#4fc3f7" font-size="16" font-family="monospace">162.550</text>
  <!-- Alert LED -->
  <circle cx="680" cy="280" r="10" fill="#f39c12"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <text x="705" y="285" fill="#f39c12" font-size="11" font-family="Arial">ALERT</text>
  <!-- SAME code indicator -->
  <rect x="640" y="310" width="130" height="30" rx="4" fill="#1a2a3a"/>
  <text x="705" y="330" text-anchor="middle" fill="#2ecc71" font-size="12" font-family="monospace">SAME: 06037</text>
  <!-- Antenna -->
  <line x1="700" y1="180" x2="730" y2="100" stroke="#7f8c8d" stroke-width="4"/>
  <circle cx="730" cy="100" r="6" fill="#7f8c8d"/>
  <!-- Signal waves -->
  <path d="M 740 90 Q 760 80 760 100" stroke="#00acc1" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 745 80 Q 775 70 775 110" stroke="#00acc1" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="600" y="595" text-anchor="middle" fill="#ffffff66" font-size="20" font-family="Arial">AlarmBeepGuide.com</text>
</svg>
