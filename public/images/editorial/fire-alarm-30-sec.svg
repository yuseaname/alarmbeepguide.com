<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Fire alarm beeping every 30 seconds</title><desc id="d">A fire alarm with 30-second chirp diagnostic.</desc>
<rect width="1200" height="630" fill="#0f172a"/><path d="M0 0h1200v142H0z" fill="#7c2d12"/><path d="M0 142h1200" stroke="#f97316" stroke-width="8"/>
<g transform="translate(600 360)"><circle r="90" fill="none" stroke="#f97316" stroke-width="6"/><circle r="72" fill="#0f172a" stroke="#9a3412" stroke-width="2"/>
<circle r="25" fill="#431407" stroke="#f97316" stroke-width="2"/><circle r="8" fill="#fbbf24"/></g>
<g transform="translate(280 320)"><text text-anchor="middle" fill="#f97316" font-family="Arial" font-size="36" font-weight="700">30 sec</text>
<path d="M-40 20 A40 40 0 0 1 40 20" fill="none" stroke="#f97316" stroke-width="4"/>
<polygon points="40,20 50,10 50,30" fill="#f97316"/></g>
<g transform="translate(920 300)"><text text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="16" font-weight="700">POSSIBLE</text>
<text x="0" y="22" text-anchor="middle" fill="#f97316" font-family="Arial" font-size="14">Low battery</text>
<text x="0" y="42" text-anchor="middle" fill="#f97316" font-family="Arial" font-size="14">End of life</text>
<text x="0" y="62" text-anchor="middle" fill="#f97316" font-family="Arial" font-size="14">Sensor fault</text>
<text x="0" y="82" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="12">Check manual</text></g>
<text x="94" y="535" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="36" font-weight="700">FIRE ALARM CHIRPING</text>
<text x="94" y="578" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">30-second chirp: maintenance signal, not emergency alarm.</text></svg>