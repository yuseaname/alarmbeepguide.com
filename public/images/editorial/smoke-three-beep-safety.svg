<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Smoke alarm three-beep emergency guide</title><desc id="desc">A smoke alarm, three red alarm indicators, and an exit arrow.</desc><rect width="1200" height="630" fill="#1f2937"/><circle cx="1080" cy="90" r="215" fill="#7f1d1d" opacity=".55"/><g transform="translate(126 160)"><ellipse cx="188" cy="155" rx="169" ry="100" fill="#f8fafc"/><ellipse cx="188" cy="142" rx="132" ry="72" fill="#dbeafe"/><circle cx="188" cy="142" r="15" fill="#ef4444"/><path d="M110 190h156M138 216h100" stroke="#94a3b8" stroke-width="11" stroke-linecap="round"/></g><g fill="#ef4444"><circle cx="545" cy="225" r="39"/><circle cx="653" cy="225" r="39"/><circle cx="761" cy="225" r="39"/></g><text x="508" y="306" fill="#fecaca" font-family="Arial" font-size="29" font-weight="700">BEEP • BEEP • BEEP</text><path d="M520 425h255" stroke="#fbbf24" stroke-width="21" stroke-linecap="round"/><path d="m727 362 82 63-82 63" fill="none" stroke="#fbbf24" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="85" fill="#f8fafc" font-family="Arial" font-size="40" font-weight="700">THREE LOUD BEEPS: GET OUT</text><text x="101" y="555" fill="#cbd5e1" font-family="Arial" font-size="27">Call 911 from outside. Stay out until responders say it is safe.</text></svg>