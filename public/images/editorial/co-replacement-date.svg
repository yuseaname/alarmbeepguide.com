<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Carbon monoxide alarm replacement date guide</title><desc id="desc">A carbon monoxide alarm, a calendar date, and a replacement arrow.</desc><rect width="1200" height="630" fill="#0f3554"/><circle cx="1050" cy="475" r="260" fill="#0b6a78" opacity=".35"/><g transform="translate(132 164)"><circle cx="173" cy="152" r="137" fill="#f8fafc"/><circle cx="173" cy="152" r="100" fill="#dc2626"/><circle cx="173" cy="152" r="69" fill="#fff"/><text x="118" y="168" fill="#dc2626" font-family="Arial" font-size="42" font-weight="700">CO</text></g><path d="M408 313h190" stroke="#fbbf24" stroke-width="20" stroke-linecap="round"/><path d="m554 255 74 58-74 58" fill="none" stroke="#fbbf24" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(696 159)"><rect width="274" height="225" rx="24" fill="#f8fafc"/><rect width="274" height="52" rx="24" fill="#dbeafe"/><text x="33" y="119" fill="#0f3554" font-family="Arial" font-size="31" font-weight="700">REPLACE BY</text><path d="M33 155h190" stroke="#94a3b8" stroke-width="13" stroke-linecap="round"/></g><text x="101" y="84" fill="#f8fafc" font-family="Arial" font-size="40" font-weight="700">REPLACE WHEN THE LABEL SAYS TO</text><text x="102" y="548" fill="#cbd5e1" font-family="Arial" font-size="27">Use the alarm’s date and manufacturer instructions—not a generic timeline.</text></svg>