<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a2a3a"/><stop offset="100%" stop-color="#243447"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#f39c12"/>
  <!-- Floodlight fixture -->
  <rect x="480" y="100" width="240" height="60" rx="8" fill="#34495e"/>
  <ellipse cx="540" cy="130" rx="40" ry="18" fill="#f39c12"/>
  <ellipse cx="660" cy="130" rx="40" ry="18" fill="#f39c12"/>
  <!-- Motion sensor dome -->
  <ellipse cx="600" cy="180" rx="35" ry="25" fill="#7f8c8d"/>
  <circle cx="600" cy="180" r="15" fill="#1a2a3a"/>
  <circle cx="600" cy="180" r="8" fill="#e74c3c"/>
  <!-- Light beams -->
  <polygon points="540,148 300,500 420,500" fill="#f39c1255"/>
  <polygon points="660,148 780,500 900,500" fill="#f39c1255"/>
  <!-- Sensor detection arcs -->
  <path d="M 600 200 Q 400 350 350 450" stroke="#3498db" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6"/>
  <path d="M 600 200 Q 800 350 850 450" stroke="#3498db" stroke-width="2" fill="none" stroke-dasharray="8 4" opacity="0.6"/>
  <!-- Timer indicator -->
  <rect x="200" y="460" width="200" height="40" rx="8" fill="#ffffff11"/>
  <circle cx="230" cy="480" r="10" fill="#2ecc71"/>
  <rect x="250" y="475" width="120" height="6" rx="3" fill="#cbd5e0"/>
  <text x="600" y="595" text-anchor="middle" fill="#ffffff66" font-size="20" font-family="Arial">AlarmBeepGuide.com</text>
</svg>
