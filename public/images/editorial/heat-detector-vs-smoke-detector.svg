<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a2a3a"/><stop offset="100%" stop-color="#243447"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#e74c3c"/>
  <!-- VS divider -->
  <line x1="600" y1="120" x2="600" y2="480" stroke="#ffffff22" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="600" cy="300" r="40" fill="#2c3e50" stroke="#ffffff44" stroke-width="2"/>
  <text x="600" y="308" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial">VS</text>
  <!-- Heat detector (left) -->
  <circle cx="300" cy="250" r="80" fill="#e67e22" stroke="#ffffff33" stroke-width="3"/>
  <circle cx="300" cy="250" r="50" fill="#d35400"/>
  <!-- Heat waves -->
  <path d="M 230 180 Q 240 160 250 175" stroke="#e67e22" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 360 180 Q 370 160 380 175" stroke="#e67e22" stroke-width="3" fill="none" opacity="0.7"/>
  <text x="300" y="380" text-anchor="middle" fill="#e67e22" font-size="20" font-weight="bold" font-family="Arial">HEAT</text>
  <text x="300" y="410" text-anchor="middle" fill="#ffffff88" font-size="13" font-family="Arial">Temperature rise</text>
  <text x="300" y="430" text-anchor="middle" fill="#ffffff88" font-size="13" font-family="Arial">Fixed temp 135°F+</text>
  <!-- Smoke detector (right) -->
  <circle cx="900" cy="250" r="80" fill="#3498db" stroke="#ffffff33" stroke-width="3"/>
  <circle cx="900" cy="250" r="50" fill="#2980b9"/>
  <!-- Smoke particles -->
  <circle cx="850" cy="180" r="6" fill="#ffffff44"/><circle cx="870" cy="170" r="8" fill="#ffffff33"/>
  <circle cx="930" cy="175" r="5" fill="#ffffff44"/><circle cx="950" cy="185" r="7" fill="#ffffff33"/>
  <text x="900" y="380" text-anchor="middle" fill="#3498db" font-size="20" font-weight="bold" font-family="Arial">SMOKE</text>
  <text x="900" y="410" text-anchor="middle" fill="#ffffff88" font-size="13" font-family="Arial">Photoelectric / ionization</text>
  <text x="900" y="430" text-anchor="middle" fill="#ffffff88" font-size="13" font-family="Arial">Detects particles early</text>
  <text x="600" y="595" text-anchor="middle" fill="#ffffff66" font-size="20" font-family="Arial">AlarmBeepGuide.com</text>
</svg>
