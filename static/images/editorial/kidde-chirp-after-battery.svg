<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Kidde detector still chirping after battery change</title><desc id="d">A Kidde smoke alarm with fresh batteries but still showing a warning indicator.</desc>
<rect width="1200" height="630" fill="#0f172a"/><path d="M0 0h1200v142H0z" fill="#7c2d12"/><path d="M0 142h1200" stroke="#f97316" stroke-width="8"/>
<g transform="translate(600 350)"><circle r="140" fill="none" stroke="#f97316" stroke-width="10"/><circle r="115" fill="#0f172a" stroke="#9a3412" stroke-width="2"/><circle r="55" fill="#431407" stroke="#f97316" stroke-width="2"/>
<circle r="18" fill="#fbbf24"/><text y="5" text-anchor="middle" fill="#78350f" font-family="Arial" font-size="10" font-weight="700">RESET</text></g>
<g transform="translate(300 250)"><rect width="56" height="100" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
<rect x="10" y="12" width="36" height="50" rx="3" fill="#22c55e"/><text x="28" y="85" text-anchor="middle" fill="#4ade80" font-family="Arial" font-size="11" font-weight="700">9V NEW</text></g>
<g transform="translate(900 280)"><path d="M0 40 A40 40 0 1 1 0 41" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
<polygon points="0,5 -10,20 10,20" fill="#fbbf24"/><text x="0" y="80" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="14" font-weight="700">HARD RESET</text>
<text x="0" y="100" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="12">Hold Test 20s</text></g>
<text x="94" y="535" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="38" font-weight="700">KIDDE STILL CHIRPING?</text>
<text x="94" y="578" fill="#94a3b8" font-family="Arial, sans-serif" font-size="25">Hard reset clears residual charge. Check model manual for reset steps.</text></svg>