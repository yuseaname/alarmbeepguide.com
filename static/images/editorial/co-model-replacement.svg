<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Carbon monoxide alarm model and replacement guide</title><desc id="desc">A carbon monoxide alarm beside a model label and calendar.</desc><rect width="1200" height="630" fill="#143a52"/><path d="M0 0h1200v135H0z" fill="#1f6281"/><g transform="translate(130 170)"><circle cx="175" cy="158" r="142" fill="#f8fafc"/><circle cx="175" cy="158" r="103" fill="#dc2626"/><circle cx="175" cy="158" r="71" fill="#fff"/><text x="119" y="174" fill="#dc2626" font-family="Arial" font-size="43" font-weight="700">CO</text></g><g transform="translate(493 160)"><rect width="255" height="200" rx="20" fill="#f8fafc"/><rect width="255" height="47" rx="20" fill="#dbeafe"/><text x="34" y="105" fill="#143a52" font-family="Arial" font-size="26" font-weight="700">MODEL / DATE</text><path d="M34 138h180M34 166h136" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/></g><g transform="translate(829 166)"><rect width="220" height="196" rx="20" fill="#f8fafc"/><rect width="220" height="49" rx="20" fill="#fbbf24"/><path d="M42 97h136M42 137h100" stroke="#94a3b8" stroke-width="13" stroke-linecap="round"/><circle cx="174" cy="142" r="22" fill="#22c55e"/></g><text x="104" y="85" fill="#f8fafc" font-family="Arial" font-size="40" font-weight="700">CO ALARM: CHECK THE MODEL AND DATE</text><text x="104" y="546" fill="#cbd5e1" font-family="Arial" font-size="27">A beep count alone is not a universal replacement code.</text></svg>