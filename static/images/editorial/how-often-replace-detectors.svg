<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">How often to replace smoke detectors</title><desc id="d">A replacement schedule chart by detector type.</desc>
<rect width="1200" height="630" fill="#0f172a"/><path d="M0 0h1200v142H0z" fill="#164e36"/><path d="M0 142h1200" stroke="#22c55e" stroke-width="8"/>
<g font-family="Arial, sans-serif" font-weight="700"><g transform="translate(250 340)"><circle r="55" fill="#14532d" stroke="#22c55e" stroke-width="3"/>
<text y="-5" text-anchor="middle" fill="#4ade80" font-size="32">10</text><text y="20" text-anchor="middle" fill="#94a3b8" font-size="13">YEARS</text>
<text y="90" text-anchor="middle" fill="#f1f5f9" font-size="16">Smoke</text></g>
<g transform="translate(500 340)"><circle r="55" fill="#14532d" stroke="#22c55e" stroke-width="3"/>
<text y="-5" text-anchor="middle" fill="#4ade80" font-size="32">10</text><text y="20" text-anchor="middle" fill="#94a3b8" font-size="13">YEARS</text>
<text y="90" text-anchor="middle" fill="#f1f5f9" font-size="16">Combo S/C</text></g>
<g transform="translate(750 340)"><circle r="55" fill="#431407" stroke="#f97316" stroke-width="3"/>
<text y="-5" text-anchor="middle" fill="#fb923c" font-size="32">5-7</text><text y="20" text-anchor="middle" fill="#94a3b8" font-size="13">YEARS</text>
<text y="90" text-anchor="middle" fill="#f1f5f9" font-size="16">CO Only</text></g>
<g transform="translate(1000 340)"><circle r="55" fill="#431407" stroke="#f97316" stroke-width="3"/>
<text y="-5" text-anchor="middle" fill="#fb923c" font-size="32">7-10</text><text y="20" text-anchor="middle" fill="#94a3b8" font-size="13">YEARS</text>
<text y="90" text-anchor="middle" fill="#f1f5f9" font-size="16">Smart</text></g></g>
<text x="94" y="535" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="36" font-weight="700">REPLACEMENT TIMELINE</text>
<text x="94" y="578" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">From manufacture date, not install date. Per UL standards.</text></svg>