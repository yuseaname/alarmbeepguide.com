<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Smoke detector false alarms</title><desc id="d">A kitchen scene showing cooking steam triggering a nearby smoke alarm.</desc>
<rect width="1200" height="630" fill="#0f172a"/><path d="M0 0h1200v142H0z" fill="#7c2d12"/><path d="M0 142h1200" stroke="#f97316" stroke-width="8"/>
<g transform="translate(300 370)"><rect x="-60" y="0" width="120" height="80" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="3"/>
<circle cx="0" cy="35" r="20" fill="#f97316" opacity="0.3"/><path d="M-30 0 Q-30 -30 0 -40 Q30 -30 30 0" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.5"/>
<text x="0" y="100" text-anchor="middle" fill="#f97316" font-family="Arial" font-size="16" font-weight="700">STOVE</text></g>
<g transform="translate(700 300)"><circle r="70" fill="none" stroke="#ef4444" stroke-width="6"/><circle r="55" fill="#0f172a" stroke="#991b1b" stroke-width="2"/>
<circle r="12" fill="#ef4444"/><text y="90" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="14" font-weight="700">ALARM</text></g>
<path d="M380 330 Q500 280 620 310" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 4" opacity="0.5"/>
<g transform="translate(950 300)"><text text-anchor="middle" fill="#22c55e" font-family="Arial" font-size="42" font-weight="700">10 ft</text>
<text x="0" y="30" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="16">minimum</text>
<text x="0" y="50" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="16">distance</text></g>
<text x="94" y="535" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="38" font-weight="700">FALSE ALARMS</text>
<text x="94" y="578" fill="#94a3b8" font-family="Arial, sans-serif" font-size="25">Install 10 ft from cooking. Clean sensor monthly. Use hush feature.</text></svg>