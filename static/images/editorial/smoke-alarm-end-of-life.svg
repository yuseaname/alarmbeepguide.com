<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Smoke alarm end of life beeps</title><desc id="d">A smoke alarm with a calendar showing the 10-year expiration.</desc>
<rect width="1200" height="630" fill="#0f172a"/><path d="M0 0h1200v142H0z" fill="#7f1d1d"/><path d="M0 142h1200" stroke="#dc2626" stroke-width="8"/>
<g transform="translate(400 360)"><circle r="90" fill="none" stroke="#dc2626" stroke-width="6"/><circle r="72" fill="#0f172a" stroke="#991b1b" stroke-width="2"/>
<circle r="25" fill="#7f1d1d" stroke="#dc2626" stroke-width="2"/><circle r="8" fill="#ef4444"/></g>
<g transform="translate(800 300)"><rect width="140" height="120" rx="10" fill="#1e293b" stroke="#dc2626" stroke-width="3"/>
<rect width="140" height="30" rx="10" fill="#dc2626"/><text x="70" y="22" text-anchor="middle" fill="#fef2f2" font-family="Arial" font-size="14" font-weight="700">MFG DATE</text>
<text x="70" y="55" text-anchor="middle" fill="#fca5a5" font-family="Arial" font-size="20" font-weight="700">03/2016</text>
<text x="70" y="80" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="14">+ 10 years</text>
<text x="70" y="105" text-anchor="middle" fill="#ef4444" font-family="Arial" font-size="18" font-weight="700">EXPIRED</text></g>
<path d="M620 360 L750 360" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 5" opacity="0.5"/>
<text x="94" y="535" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="36" font-weight="700">END-OF-LIFE BEEPS</text>
<text x="94" y="578" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">Replace after 10 years from manufacture date. Per NFPA and UL standards.</text></svg>