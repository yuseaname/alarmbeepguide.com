<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">How to reset a smoke detector</title><desc id="d">A four-step reset process shown as numbered circles connected by arrows.</desc>
<rect width="1200" height="630" fill="#0f172a"/><path d="M0 0h1200v142H0z" fill="#164e36"/><path d="M0 142h1200" stroke="#22c55e" stroke-width="8"/>
<g font-family="Arial, sans-serif" font-weight="700"><g transform="translate(200 340)"><circle r="55" fill="#14532d" stroke="#22c55e" stroke-width="4"/>
<text y="-5" text-anchor="middle" fill="#4ade80" font-size="32">1</text><text y="20" text-anchor="middle" fill="#94a3b8" font-size="13">Remove</text><text y="38" text-anchor="middle" fill="#94a3b8" font-size="13">Power</text></g>
<g transform="translate(467 340)"><circle r="55" fill="#14532d" stroke="#22c55e" stroke-width="4"/>
<text y="-5" text-anchor="middle" fill="#4ade80" font-size="32">2</text><text y="20" text-anchor="middle" fill="#94a3b8" font-size="13">Hold Test</text><text y="38" text-anchor="middle" fill="#94a3b8" font-size="13">15-20 sec</text></g>
<g transform="translate(733 340)"><circle r="55" fill="#14532d" stroke="#22c55e" stroke-width="4"/>
<text y="-5" text-anchor="middle" fill="#4ade80" font-size="32">3</text><text y="20" text-anchor="middle" fill="#94a3b8" font-size="13">Wait</text><text y="38" text-anchor="middle" fill="#94a3b8" font-size="13">30 sec</text></g>
<g transform="translate(1000 340)"><circle r="55" fill="#14532d" stroke="#22c55e" stroke-width="4"/>
<text y="-5" text-anchor="middle" fill="#4ade80" font-size="32">4</text><text y="20" text-anchor="middle" fill="#94a3b8" font-size="13">Reconnect</text><text y="38" text-anchor="middle" fill="#94a3b8" font-size="13">&amp; Test</text></g></g>
<path d="M260 340 L410 340 M527 340 L677 340 M793 340 L943 340" stroke="#22c55e" stroke-width="3" fill="none" opacity="0.4" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#22c55e" opacity="0.4"/></marker></defs>
<text x="94" y="535" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="38" font-weight="700">HOW TO RESET</text>
<text x="94" y="578" fill="#94a3b8" font-family="Arial, sans-serif" font-size="25">Disconnect power, hold test button, wait, reconnect. Check model manual.</text></svg>