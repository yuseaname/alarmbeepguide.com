<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a2a3a"/><stop offset="100%" stop-color="#243447"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#9b59b6"/>
  <!-- Alarm keypad panel -->
  <rect x="380" y="100" width="440" height="380" rx="12" fill="#2c3e50" stroke="#ffffff22" stroke-width="2"/>
  <!-- Display -->
  <rect x="420" y="130" width="360" height="80" rx="6" fill="#0d1b2a"/>
  <text x="600" y="170" text-anchor="middle" fill="#e74c3c" font-size="28" font-family="monospace" font-weight="bold">SYSTEM TROUBLE</text>
  <text x="600" y="195" text-anchor="middle" fill="#f39c12" font-size="16" font-family="monospace">CODE: 04 - BATTERY LOW</text>
