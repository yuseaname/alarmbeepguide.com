    <rect x="440" y="240" width="60" height="50" rx="6"/><rect x="520" y="240" width="60" height="50" rx="6"/><rect x="600" y="240" width="60" height="50" rx="6"/>
    <rect x="440" y="310" width="60" height="50" rx="6"/><rect x="520" y="310" width="60" height="50" rx="6"/><rect x="600" y="310" width="60" height="50" rx="6"/>
    <rect x="440" y="380" width="60" height="50" rx="6"/><rect x="520" y="380" width="60" height="50" rx="6"/><rect x="600" y="380" width="60" height="50" rx="6"/>
  </g>
  <!-- Status LEDs -->
  <circle cx="700" cy="260" r="8" fill="#e74c3c"/><text x="715" y="265" fill="#e74c3c" font-size="12" font-family="Arial">ALARM</text>
  <circle cx="700" cy="295" r="8" fill="#f39c12"/><text x="715" y="300" fill="#f39c12" font-size="12" font-family="Arial">TROUBLE</text>
  <circle cx="700" cy="330" r="8" fill="#2ecc71"/><text x="715" y="335" fill="#2ecc71" font-size="12" font-family="Arial">READY</text>
  <text x="600" y="595" text-anchor="middle" fill="#ffffff66" font-size="20" font-family="Arial">AlarmBeepGuide.com</text>
