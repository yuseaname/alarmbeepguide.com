<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="leftRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="rightRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="225" x2="1600" y2="225"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="675" x2="1600" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>

  <!-- Title -->
  <text x="800" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#f1f5f9">First Alert SC5 vs Nest Protect</text>
  <text x="800" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8">Smart Smoke &amp; CO Alarm Replacement Guide</text>

  <!-- VS badge -->
  <circle cx="800" cy="450" r="55" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
  <text x="800" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#fbbf24">VS</text>

  <!-- LEFT: Nest Protect (legacy) -->
  <g transform="translate(400, 450)">
    <!-- Outer ring -->
    <circle r="170" fill="none" stroke="url(#leftRing)" stroke-width="8"/>
    <!-- Inner disc -->
    <circle r="140" fill="#0f172a" stroke="#1e40af" stroke-width="2"/>
    <!-- Center speaker mesh pattern -->
    <circle r="80" fill="#1e3a5f" stroke="#2563eb" stroke-width="2"/>
    <!-- Speaker dots -->
    <g fill="#3b82f6" opacity="0.4">
      <circle cx="-30" cy="-30" r="3"/>
      <circle cx="0" cy="-30" r="3"/>
      <circle cx="30" cy="-30" r="3"/>
      <circle cx="-30" cy="0" r="3"/>
      <circle cx="0" cy="0" r="3"/>
      <circle cx="30" cy="0" r="3"/>
      <circle cx="-30" cy="30" r="3"/>
      <circle cx="0" cy="30" r="3"/>
      <circle cx="30" cy="30" r="3"/>
    </g>
    <!-- LED ring segments (colored) -->
    <path d="M -170 0 A 170 170 0 0 1 0 -170" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.6"/>
    <!-- Label -->
    <text x="0" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#60a5fa">Nest Protect</text>
    <text x="0" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Discontinued · March 2025</text>
    <!-- Spec badges -->
    <g transform="translate(0, 300)">
      <rect x="-120" y="0" width="240" height="32" rx="16" fill="#1e3a5f" stroke="#2563eb" stroke-width="1"/>
      <text x="0" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#93c5fd">Split Spectrum · AA Lithium</text>
    </g>
  </g>

  <!-- RIGHT: First Alert SC5 (current) -->
  <g transform="translate(1200, 450)">
    <!-- Outer ring -->
    <circle r="170" fill="none" stroke="url(#rightRing)" stroke-width="8"/>
    <!-- Inner disc -->
    <circle r="140" fill="#0f172a" stroke="#166534" stroke-width="2"/>
    <!-- Center area -->
    <circle r="80" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <!-- Center button -->
    <circle r="30" fill="#16a34a" stroke="#22c55e" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#dcfce7">TEST</text>
    <!-- LED indicator (single) -->
    <circle cx="0" cy="-55" r="5" fill="#22c55e" opacity="0.8"/>
    <!-- Label -->
    <text x="0" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#4ade80">First Alert SC5</text>
    <text x="0" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Current · $129.99</text>
    <!-- Spec badges -->
    <g transform="translate(0, 300)">
      <rect x="-120" y="0" width="240" height="32" rx="16" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
      <text x="0" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#86efac">Photoelectric · CR123A</text>
    </g>
  </g>

  <!-- Bottom info bar -->
  <rect x="0" y="810" width="1600" height="90" fill="#0f172a"/>
  <g font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">
    <!-- Feature items -->
    <g transform="translate(200, 855)">
      <circle cx="-15" cy="-5" r="6" fill="#22c55e"/>
      <text x="0" y="0">Google Home Compatible</text>
    </g>
    <g transform="translate(550, 855)">
      <circle cx="-15" cy="-5" r="6" fill="#22c55e"/>
      <text x="0" y="0">Wireless Interconnect (up to 18)</text>
    </g>
    <g transform="translate(950, 855)">
      <circle cx="-15" cy="-5" r="6" fill="#22c55e"/>
      <text x="0" y="0">Voice Alerts with Location</text>
    </g>
    <g transform="translate(1300, 855)">
      <circle cx="-15" cy="-5" r="6" fill="#22c55e"/>
      <text x="0" y="0">10-Year Sensor Life</text>
    </g>
  </g>

  <!-- Source attribution -->
  <text x="1580" y="890" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#475569">Sources: First Alert · Google Support</text>
</svg>
