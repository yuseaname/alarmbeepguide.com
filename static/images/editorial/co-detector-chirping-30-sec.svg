<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Carbon monoxide detector chirping every 30 seconds</title><desc id="d">A CO detector with chirp interval timer showing diagnostic steps.</desc>
<rect width="1200" height="630" fill="#0f172a"/><path d="M0 0h1200v142H0z" fill="#7f1d1d"/><path d="M0 142h1200" stroke="#dc2626" stroke-width="8"/>
<g transform="translate(600 360)"><circle r="95" fill="none" stroke="#dc2626" stroke-width="6"/><circle r="75" fill="#0f172a" stroke="#991b1b" stroke-width="2"/>
<circle r="28" fill="#7f1d1d" stroke="#dc2626" stroke-width="2"/><text y="5" text-anchor="middle" fill="#fca5a5" font-family="Arial" font-size="14" font-weight="700">CO</text></g>
<g transform="translate(280 310)"><text text-anchor="middle" fill="#dc2626" font-family="Arial" font-size="36" font-weight="700">30 sec</text>
<path d="M-40 20 A40 40 0 0 1 40 20" fill="none" stroke="#dc2626" stroke-width="4"/>
<polygon points="40,20 50,10 50,30" fill="#dc2626"/><text x="0" y="55" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="14">chirp cycle</text></g>
<g transform="translate(920 300)"><rect width="130" height="120" rx="10" fill="#1e293b" stroke="#dc2626" stroke-width="2"/>
<text x="65" y="25" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="12" font-weight="700">CHECK</text>
<text x="65" y="45" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="12">1. Battery</text>
<text x="65" y="60" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="12">2. Date</text>
<text x="65" y="75" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="12">3. Manual</text>
<text x="65" y="90" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="12">4. EOL?</text>
<text x="65" y="105" text-anchor="middle" fill="#dc2626" font-family="Arial" font-size="12">5. Replace</text></g>
<text x="94" y="535" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="36" font-weight="700">CO DETECTOR CHIRPING</text>
<text x="94" y="578" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">30-second chirp: check battery, age, and model manual before assuming cause.</text></svg>